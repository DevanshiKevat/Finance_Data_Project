name: 3 - Daily Incremental

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      run_date:
        description: "Override date (YYYY-MM-DD)"
        required: false

jobs:
  incremental:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    ###################################
    # Restore checkpoint
    ###################################

    - name: Restore pipeline state
      id: restore
      uses: actions/download-artifact@v4
      with:
        name: pipeline-state
        path: data/state/
      continue-on-error: true


    - name: Check restore status
      run: |
        echo "Restore outcome: ${{ steps.restore.outcome }}"
        ls -la data/state/ || echo "First run — no checkpoint"


    ###################################
    # First run → Full load
    ###################################

    - name: Run full load if checkpoint missing
      env:
        OUTPUT_PATH: ./data

      run: |
        if [ ! -f data/state/checkpoint.json ]; then

          echo "No checkpoint found"
          echo "Running FULL LOAD"

          python Scripts/incremental_daily.py \
          --mode full

        else

          echo "Checkpoint exists"
          echo "Skipping full load"

        fi


    ###################################
    # Daily Incremental
    ###################################

    - name: Run incremental pipeline
      env:
        OUTPUT_PATH: ./data

      run: |

        if [ -n "${{ github.event.inputs.run_date }}" ]; then

          python Scripts/incremental_daily.py \
          --mode daily \
          --date "${{ github.event.inputs.run_date }}"

        else

          python Scripts/incremental_daily.py \
          --mode daily

        fi


    ###################################
    # Upload to Snowflake
    ###################################

    ###################################
# Upload to Snowflake
###################################
    
    - name: Upload incremental CSVs to Snowflake
      env:
        SNOWFLAKE_ORGANIZATION: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    
      run: |
          python Scripts/upload_to_snowflake.py \
          --mode incremental


    ###################################
    # Save checkpoint
    ###################################

    - name: Save updated pipeline state
      if: always()

      uses: actions/upload-artifact@v4

      with:
        name: pipeline-state

        path: |
          data/state/checkpoint.json
          data/state/open_invoices.json

        overwrite: true
        retention-days: 90  
