name: 3 - Daily Incremental

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override date (YYYY-MM-DD), leave blank for today"
        required: false

concurrency:
  group: incremental-snowflake
  cancel-in-progress: true

jobs:
  incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'                    # ← caches pip downloads

      - name: Install dependencies
        run: |
          pip install --retries 5 \
                      --timeout 120 \
                      -r requirements.txt  # ← retries 5x with longer timeout

      - name: Run incremental_daily.py
        env:
          OUTPUT_PATH:            ./data
          SNOWFLAKE_ORGANIZATION: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          SNOWFLAKE_ACCOUNT:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:         ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:     ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE:    ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:     ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python Scripts/incremental_daily.py --mode daily --date "${{ github.event.inputs.run_date }}"
          else
            python Scripts/incremental_daily.py --mode daily
          fi

      - name: Upload to Snowflake
        env:
          SNOWFLAKE_ORGANIZATION: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          SNOWFLAKE_ACCOUNT:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:         ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:     ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE:    ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:     ${{ secrets.SNOWFLAKE_DATABASE }}
          OUTPUT_PATH:            ./data
        run: python Scripts/upload_to_snowflake.py --mode incremental
