name: 3 - Daily Incremental

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override date (YYYY-MM-DD), leave blank for today"
        required: false

jobs:
  incremental:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Restore pipeline state from previous run ──────────────
      - name: Restore pipeline state
        uses: actions/download-artifact@v4
        with:
          name: pipeline-state
          path: data/state/
        continue-on-error: true   # First-ever run has no artifact yet

      # ── 5. Bootstrap: full load if no checkpoint exists ──────────
      - name: Run full load if no checkpoint
        env:
          OUTPUT_PATH: ./data
        run: |
          if [ ! -f ./data/state/checkpoint.json ]; then
            echo "No checkpoint found — running full load to bootstrap state..."
            python scripts/incremental_daily.py --mode full
          else
            echo "Checkpoint found — skipping full load."
          fi

      # ── 6. Daily incremental run ─────────────────────────────────
      - name: Run incremental_daily.py
        env:
          OUTPUT_PATH: ./data
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            echo "Running for override date: ${{ github.event.inputs.run_date }}"
            python scripts/incremental_daily.py --mode daily --date "${{ github.event.inputs.run_date }}"
          else
            echo "Running for today's date"
            python scripts/incremental_daily.py --mode daily
          fi

      # ── 7. Upload CSVs to Snowflake ──────────────────────────────
      - name: Upload incremental CSVs to Snowflake + COPY INTO
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
          OUTPUT_PATH:         ./data
        run: python scripts/upload_to_snowflake.py --mode incremental

      # ── 8. Save updated state for next run ───────────────────────
      - name: Save updated pipeline state
        if: always()    # Save state even if a step failed
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            data/state/checkpoint.json
            data/state/open_invoices.json
          retention-days: 90
          overwrite: true    # Replaces previous day's artifact
