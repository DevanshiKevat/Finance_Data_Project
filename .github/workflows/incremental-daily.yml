name: 3 - Daily Incremental

on:
  schedule:
    - cron: "0 6 * * *"    # runs daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override date (YYYY-MM-DD), leave blank for today"
        required: false

concurrency:
  group: incremental-snowflake
  cancel-in-progress: true

jobs:
  incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ✅ STEP 1: Try to download state from previous run
      - name: Restore pipeline state
        uses: actions/download-artifact@v4
        with:
          name: pipeline-state
          path: data/state/
        continue-on-error: true    # don't fail if no prior artifact exists

      # ✅ STEP 2: Check state files are present before proceeding
      - name: Check state files exist
        run: |
          if [ ! -f data/state/checkpoint.json ]; then
            echo "❌ ERROR: checkpoint.json not found."
            echo "Please run Workflow 2 (full load) successfully first."
            exit 1
          fi
          echo "✅ State files found, proceeding with incremental run..."

      # ✅ STEP 3: Run the incremental script
      - name: Run incremental_daily.py
        env:
          OUTPUT_PATH: ./data
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            python Scripts/incremental_daily.py --mode daily --date "${{ github.event.inputs.run_date }}"
          else
            python Scripts/incremental_daily.py --mode daily
          fi

      # ✅ STEP 4: Upload new CSVs to Snowflake
      - name: Upload to Snowflake
        env:
          SNOWFLAKE_ORGANIZATION: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          SNOWFLAKE_ACCOUNT:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:         ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:     ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE:    ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:     ${{ secrets.SNOWFLAKE_DATABASE }}
          OUTPUT_PATH:            ./data
        run: python Scripts/upload_to_snowflake.py --mode incremental

      # ✅ STEP 5: Save updated state for tomorrow's run (overwrites previous)
      - name: Save updated pipeline state
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-state
          path: |
            data/state/checkpoint.json
            data/state/open_invoices.json
          retention-days: 90
          overwrite: true
