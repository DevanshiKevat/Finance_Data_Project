name: 1 - Provision Snowflake (Terraform)

on:
  push:
    paths: ["terraform/**"]
  workflow_dispatch:

concurrency:
  group: terraform-snowflake
  cancel-in-progress: true        # ← cancels older run automatically

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_snowflake_organization: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          TF_VAR_snowflake_account:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_user:         ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_snowflake_password:     ${{ secrets.SNOWFLAKE_PASSWORD }}
          TF_VAR_snowflake_role:         ${{ secrets.SNOWFLAKE_ROLE }}
        run: terraform plan -input=false -no-color

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_snowflake_organization: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          TF_VAR_snowflake_account:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_user:         ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_snowflake_password:     ${{ secrets.SNOWFLAKE_PASSWORD }}
          TF_VAR_snowflake_role:         ${{ secrets.SNOWFLAKE_ROLE }}
        run: terraform apply -input=false -auto-approve -no-color
