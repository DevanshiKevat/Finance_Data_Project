name: 4 - dbt CI (PR Check)

on:
  pull_request:
    branches: [main]
    paths:
      - "dbt_project/**"    # only triggers if dbt files changed

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write dbt profiles.yml
        env:
          SNOWFLAKE_ORGANIZATION: ${{ secrets.SNOWFLAKE_ORGANIZATION }}
          SNOWFLAKE_ACCOUNT:      ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:         ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:     ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          finance_data_project:
            target: pr
            outputs:
              pr:
                type: snowflake
                account: "${SNOWFLAKE_ORGANIZATION}-${SNOWFLAKE_ACCOUNT}"
                user: "${SNOWFLAKE_USER}"
                password: "${SNOWFLAKE_PASSWORD}"
                role: SYSADMIN
                warehouse: COMPUTE_WH
                database: ANALYTICS_DB
                schema: DBT_PR_{{ github.event.pull_request.number }}
                threads: 4
          EOF

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt compile (check SQL is valid)
        working-directory: dbt_project
        run: dbt compile

      - name: dbt run (deploy to PR schema)
        working-directory: dbt_project
        run: dbt run --target pr

      - name: dbt test (check data quality)
        working-directory: dbt_project
        run: dbt test --target pr

      - name: Comment results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const emoji = outcome === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **dbt CI check ${outcome}**\n\nAll models compiled and tests passed. Safe to merge.`
            })
